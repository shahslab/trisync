# Builds the web app and deploys it to Fly.io (https://trisync.fly.dev) on every push to master.
# Needs the FLY_API_TOKEN repository secret: a deploy token for the `trisync` app
# (`fly tokens create deploy -a trisync`). Strava keys are still entered in the app.
name: Deploy web app

on:
  push:
    branches: [master]
    paths-ignore: ['pocketbase/**', '**.md']
  workflow_dispatch:

concurrency:
  group: fly-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN isn't set, so nothing was deployed. Run 'fly deploy' by hand, or add the secret."
            exit 0
          fi
          flyctl deploy --remote-only --ha=false
