# Builds the web app and publishes it to GitHub Pages (https://<owner>.github.io/<repo>/)
# on every push to master. No secrets are needed: Strava keys are entered in the app.
name: Deploy web app

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export web build
        run: npx expo export -p web --output-dir dist
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_NO_DOTENV: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
